<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060b3a">
<title>Party Night · Telefono</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  html,body{min-height:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  body{display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
       background:#0b1568;border-bottom:4px solid var(--c,var(--gold))}
  .top .av{font-size:1.8rem;line-height:1}
  .top .nm{flex:1;font-weight:700;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top .sc{font-family:var(--title);font-size:1.6rem;color:var(--gold)}
  .conn{font-size:.8rem;color:var(--ko);text-align:center;padding:4px;background:#ff547022}
  main{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 14px 28px;text-align:center;max-width:560px;width:100%;margin:0 auto}
  .emoji{font-size:clamp(3.4rem,18vw,5.5rem);line-height:1}
  .title{font-family:var(--title);font-size:1.7rem;line-height:1.2;color:var(--gold);letter-spacing:.03em}
  .big{font-family:var(--title);font-size:clamp(2rem,10vw,3.2rem);line-height:1.15;text-shadow:0 3px 0 #0005}
  .text{color:#dfe4ff;font-size:1.1rem;line-height:1.35}
  .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .tags span{background:#ff547033;border:2px solid var(--ko);border-radius:99px;padding:3px 12px;font-weight:700}
  .timer{font-family:var(--title);font-size:2.4rem;color:var(--ok)}
  .timer.low{color:var(--ko)}
  .group{width:100%;display:grid;gap:10px}
  .group h4{font-weight:600;color:var(--mute);font-size:1rem}
  .opts{display:grid;gap:10px;grid-template-columns:1fr}
  .opts.grid{grid-template-columns:1fr 1fr}
  .o{display:flex;align-items:center;justify-content:center;gap:10px;min-height:62px;padding:12px 14px;border-radius:16px;
     background:#ffffff14;border:3px solid #ffffff30;font-weight:700;font-size:1.15rem;line-height:1.15;transition:transform .08s,background .15s}
  .o:active{transform:scale(.97)}
  .o .e{font-size:1.5rem}
  .o small{display:block;color:var(--mute);font-weight:500;font-size:.8rem}
  .o.sel{background:var(--gold);color:#1a1200;border-color:#fff}
  .o.ok{background:var(--ok);color:#00230f;border-color:#fff}
  .o.ko{background:var(--ko);color:#2a0008;border-color:#fff}
  .o.ghost{background:transparent}
  .o:disabled{opacity:.4;pointer-events:none}
  .pulse{animation:pulse 1.4s infinite}
  main{padding-bottom:96px}
  .reactbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
            background:#0b1568f2;border-top:3px solid #ffffff22;backdrop-filter:blur(6px)}
  .reactbar button{flex:1;max-width:60px;font-size:1.7rem;padding:6px 0;border-radius:14px;background:#ffffff14;transition:transform .08s}
  .reactbar button:active{transform:scale(1.3)}
  .chainv{display:grid;gap:4px;width:100%;justify-items:center}
  .chainv .cw{font-family:var(--title);letter-spacing:.12em;font-size:1.25rem;padding:7px 14px;border-radius:12px;width:100%;max-width:340px;
              background:#ffffff14;border:2px solid #ffffff33}
  .chainv .cw.edge{background:linear-gradient(160deg,#ffd75e,#e0951a);color:#3a2300;border-color:#fff8}
  .chainv .cw.sol0{background:linear-gradient(160deg,#ff4a64,#a30f26);border-color:#fff8}
  .chainv .cw.sol1{background:linear-gradient(160deg,#4d93ff,#1245b8);border-color:#fff8}
  .chainv .cl{opacity:.6;line-height:.9;font-size:.9rem}
  .notes{display:grid;gap:6px;width:100%}
  .note{background:#7b2cbf55;border:2px solid #c77dff;border-radius:14px;padding:8px 12px;font-weight:700}
  .tapwrap{width:100%;display:grid;gap:10px}
  .tapbtn{min-height:140px;border-radius:24px;background:linear-gradient(160deg,#ffd75e,#e0951a);color:#3a2300;font-family:var(--title);font-size:1.6rem;
          border:4px solid #fff;box-shadow:0 8px 0 #8a5a00;transition:transform .05s;touch-action:manipulation}
  .tapbtn:active{transform:translateY(5px);box-shadow:0 3px 0 #8a5a00}
  .tapbar{height:16px;background:#ffffff22;border-radius:99px;overflow:hidden}
  .tapbar i{display:block;height:100%;background:var(--ok);transition:width .08s}
  .anim-drum{animation:drum .3s infinite}
  .anim-ring{animation:ring .5s infinite}
  @keyframes drum{25%{transform:translate(-5px,3px) rotate(-3deg)}75%{transform:translate(5px,-3px) rotate(3deg)}}
  @keyframes ring{20%{transform:rotate(-18deg)}40%{transform:rotate(16deg)}60%{transform:rotate(-12deg)}80%{transform:rotate(10deg)}}
  .vals{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:420px}
  .vals span{min-width:42px;padding:3px 6px;border-radius:8px;font-family:var(--title);font-size:1rem;color:#fff}
  .vals .b{background:#1f6bff}.vals .r{background:#e8203f}.vals .gone{opacity:.2;text-decoration:line-through}
  .inputrow{width:100%;display:flex;gap:8px}
  .inputrow input{flex:1;min-width:0;background:#050a3a;border:3px solid #ffffff30;border-radius:14px;color:var(--ink);padding:12px;font:inherit;font-size:1.05rem}
  .inputrow input:focus{outline:none;border-color:var(--gold)}
  .join{width:100%;display:grid;gap:12px}
  .join input{background:#050a3a;border:3px solid #ffffff30;border-radius:14px;color:var(--ink);padding:14px;font:inherit;font-size:1.3rem;text-align:center}
  .join input:focus{outline:none;border-color:var(--gold)}
  .err{color:var(--ko);font-weight:600}
</style>
</head>
<body>
<div id="app"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const room = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
const MEKEY = 'party-me-' + room;
let me = null;           // {pid, name}
let spec = null;         // ultimo schermo ricevuto
let picked = {};         // scelte locali evidenziate: sid -> [ids]
let online = false, busy = false;
let tapCount = 0, tapSent = false, lastReact = 0;

function loadMe(){ try{ return JSON.parse(localStorage.getItem(MEKEY)); }catch(e){ return null; } }
function saveMe(){ try{ localStorage.setItem(MEKEY, JSON.stringify(me)); }catch(e){} }
async function post(url, body){
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.error || 'errore');
  return j;
}

/* ---------- ingresso ---------- */
async function showJoin(err){
  let info = {exists:false};
  try{ info = await fetch('/api/room-info?room=' + room).then(r => r.json()); }catch(e){}
  if(!info.exists){
    $('#app').innerHTML = `<main><div class="emoji">🤷</div><div class="title">Stanza non trovata</div>
      <p class="text">Il codice <b>${esc(room || '—')}</b> non esiste (più). Chiedi all'host di mostrare di nuovo il QR code.</p></main>`;
    return;
  }
  $('#app').innerHTML = `<main>
    <div class="emoji">🎉</div>
    <div class="title">Stanza ${esc(room)}</div>
    <form class="join" onsubmit="doJoin(event)">
      <p class="text">Come ti chiami?</p>
      <input id="nm" maxlength="16" placeholder="Il tuo nome" autocomplete="off" autocapitalize="words" autofocus>
      <button class="btn big" type="submit">Entra ▶</button>
      ${err ? `<p class="err">${esc(err)}</p>` : ''}
    </form>
    ${info.roster && info.roster.length ? `
      <div class="group"><h4>…oppure sono uno di questi:</h4>
      <div class="opts grid">${info.roster.map(n => `<button class="o" onclick="joinAs(${JSON.stringify(n).replace(/"/g,'&quot;')})">${esc(n)}</button>`).join('')}</div></div>` : ''}
  </main>`;
}
function doJoin(e){ e.preventDefault(); const n = $('#nm').value.trim(); if(n) joinAs(n); }
async function joinAs(name){
  try{
    const r = await post('/api/join', {room, name});
    me = {pid:r.pid, name:r.name}; saveMe(); connect();
  }catch(e){ showJoin(e.message === 'stanza piena' ? 'La stanza è piena.' : 'Non riesco a entrare, riprova.'); }
}

/* ---------- connessione (polling) ---------- */
const POLL_MS = 900;
let loopId = 0;
function connect(){
  const my = ++loopId;                       // un solo ciclo attivo alla volta
  render();
  let n = 0, ver = '';
  (async function loop(){
    while(my === loopId){
      try{
        const hb = n % 4 === 0 ? '&hb=1&name=' + encodeURIComponent(me.name) : '';
        const r = await fetch(`/api/poll?room=${room}&pid=${me.pid}&v=${encodeURIComponent(ver)}${hb}`, {cache:'no-store'});
        const j = await r.json();
        if(!r.ok) throw new Error(j.error || r.status);
        if(!online){ online = true; render(); }
        if(j.gone){                          // stanza o giocatore non più noti: rientra col nome
          try{
            const jr = await post('/api/join', {room, pid:me.pid, name:me.name});
            me.pid = jr.pid; saveMe(); ver = '';
          }catch(e){ localStorage.removeItem(MEKEY); me = null; showJoin(); return; }
        }else if(j.screen){
          ver = j.ver;
          if(!spec || spec.sid !== j.screen.sid){ picked = {}; tapCount = 0; tapSent = false; }
          spec = j.screen; busy = false; render();
          if(navigator.vibrate && spec.buzz) navigator.vibrate(60);
        }
      }catch(e){
        if(online){ online = false; render(); }
      }
      n++;
      await new Promise(r => setTimeout(r, POLL_MS));
    }
  })();
}

/* ---------- schermo ---------- */
function render(){
  if(!me) return;
  const s = spec;
  const meInfo = (s && s.me) || {av:'🙂', name:me.name, color:'#ffcf3d', score:null};
  const sel = (s && (picked[s.sid] || s.selected)) || [];
  let html = `<div class="top" style="--c:${meInfo.color}"><span class="av">${meInfo.av}</span>
      <span class="nm">${esc(meInfo.name)}</span>${meInfo.score !== null && meInfo.score !== undefined ? `<span class="sc">${meInfo.score}</span>` : ''}</div>
    ${online ? '' : '<div class="conn">Riconnessione in corso…</div>'}<main>`;
  if(!s){
    html += `<div class="emoji pulse">⏳</div><div class="title">Ci sei!</div><p class="text">Aspetta che l'host faccia partire il gioco.</p>`;
  }else{
    if(s.values && s.values.length) html += `<div class="vals">${s.values.map(v => `<span class="${v.red ? 'r' : 'b'} ${v.gone ? 'gone' : ''}">${esc(v.t)}</span>`).join('')}</div>`;
    if(s.emoji) html += `<div class="emoji ${s.anim ? 'anim-' + s.anim : (s.wait ? 'pulse' : '')}">${s.emoji}</div>`;
    if(s.title) html += `<div class="title">${esc(s.title)}</div>`;
    if(s.big) html += `<div class="big">${esc(s.big)}</div>`;
    if(s.tags && s.tags.length) html += `<div class="tags">${s.tags.map(t => `<span>🚫 ${esc(t)}</span>`).join('')}</div>`;
    if(s.timer !== undefined && s.timer !== null) html += `<div class="timer ${s.timer <= 10 ? 'low' : ''}">⏱ ${s.timer}</div>`;
    if(s.text) html += `<p class="text">${esc(s.text)}</p>`;
    if(s.chain && s.chain.length) html += `<div class="chainv">${s.chain.map((w, i) => `<div class="cw ${w.s === 'hid' ? '' : w.s}">${esc(w.t)}</div>${i < s.chain.length - 1 ? '<div class="cl">⛓️</div>' : ''}`).join('')}</div>`;
    if(s.notes && s.notes.length) html += `<div class="notes">${s.notes.map(n => `<div class="note">${esc(n)}</div>`).join('')}</div>`;
    if(s.tap) html += `<div class="tapwrap"><button class="tapbtn" id="tapbtn" onpointerdown="tapIt(event)">${esc(s.tap.label)}<br><small id="taplbl">${tapCount} / ${s.tap.goal}</small></button>
      <div class="tapbar"><i id="tapfill" style="width:${Math.min(100, tapCount / s.tap.goal * 100)}%"></i></div></div>`;
    (s.groups || []).forEach((g, gi) => {
      html += `<div class="group">${g.title ? `<h4>${esc(g.title)}</h4>` : ''}<div class="opts ${g.layout === 'grid' ? 'grid' : ''}">
        ${g.options.map(o => `<button class="o ${o.tone || ''} ${sel.includes(o.id) ? 'sel' : ''}" ${o.disabled ? 'disabled' : ''}
          onclick="act(${JSON.stringify(o.id).replace(/"/g,'&quot;')})">${o.emoji ? `<span class="e">${o.emoji}</span>` : ''}
          <span>${esc(o.label)}${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</span></button>`).join('')}
      </div></div>`;
    });
  }
  if(s && s.input){
    html += `<form class="inputrow" onsubmit="sendText(event)"><input id="txt" maxlength="${s.input.max || 60}" placeholder="${esc(s.input.placeholder || '')}" autocomplete="off">
      <button class="btn small" type="submit">${esc(s.input.label || 'Invia')}</button></form>`;
  }
  html += '</main>';
  if(s && s.react && s.react.length) html += `<div class="reactbar">${s.react.map(e => `<button onclick="react('${e}')">${e}</button>`).join('')}</div>`;
  const typed = $('#txt') ? $('#txt').value : '';
  $('#app').innerHTML = html;
  if(typed && $('#txt')) $('#txt').value = typed;
  if(s && s.fx && lastFx !== s.sid){ lastFx = s.sid; fire(s.fx); }
}

/* effetti: festa o fischi */
let lastFx = null;
function fire(kind){
  const list = kind === 'boo' ? ['🍅','👎','😒','🤡','💩'] : ['🎉','🥳','✨','🎊','🔥'];
  for(let i = 0; i < 28; i++){
    const e = document.createElement('div');
    e.className = 'fx'; e.textContent = list[i % list.length];
    e.style.left = Math.random() * 100 + 'vw';
    e.style.fontSize = (20 + Math.random() * 30) + 'px';
    e.style.animationDuration = (1.6 + Math.random() * 1.8) + 's';
    e.style.animationDelay = Math.random() * .4 + 's';
    e.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 4200);
  }
  if(navigator.vibrate) navigator.vibrate(kind === 'boo' ? [80, 60, 80] : [40, 40, 40, 40, 120]);
}

async function act(id){
  if(!spec || busy) return;
  busy = true; setTimeout(() => { busy = false; }, 350);
  picked[spec.sid] = spec.multi ? togglePick(picked[spec.sid] || [], id) : [id];
  render();
  if(navigator.vibrate) navigator.vibrate(25);
  try{ await post('/api/act', {room, pid:me.pid, data:{sid:spec.sid, id}}); }catch(e){}
}
/* tocca ripetutamente per rompere il sigillo del pacco */
async function tapIt(e){
  if(e) e.preventDefault();
  if(!spec || !spec.tap || tapSent) return;
  tapCount++;
  if(navigator.vibrate) navigator.vibrate(12);
  const goal = spec.tap.goal;
  const f = $('#tapfill'), l = $('#taplbl');
  if(f) f.style.width = Math.min(100, tapCount / goal * 100) + '%';
  if(l) l.textContent = Math.min(tapCount, goal) + ' / ' + goal;
  if(tapCount >= goal){
    tapSent = true;
    if(navigator.vibrate) navigator.vibrate([40, 30, 80]);
    try{ await post('/api/act', {room, pid:me.pid, data:{sid:spec.sid, id:spec.tap.id}}); }catch(err){ tapSent = false; }
  }
}
/* reazioni live: arrivano sullo schermo grande */
async function react(emoji){
  const now = Date.now(); if(now - lastReact < 700) return; lastReact = now;
  if(navigator.vibrate) navigator.vibrate(15);
  try{ await post('/api/act', {room, pid:me.pid, data:{sid:spec ? spec.sid : '', id:'r:' + emoji}}); }catch(err){}
}
async function sendText(e){
  e.preventDefault();
  const el = $('#txt'); if(!el || !spec || !spec.input) return;
  const text = el.value.trim(); if(!text) return;
  el.value = '';
  try{ await post('/api/act', {room, pid:me.pid, data:{sid:spec.sid, id:spec.input.id, text:text.slice(0, 80)}}); }catch(err){}
}
const togglePick = (arr, id) => arr.includes(id) ? arr.filter(x => x !== id) : [...arr, id];

/* ---------- avvio ---------- */
if(!room){
  $('#app').innerHTML = '<main><div class="emoji">📷</div><div class="title">Scansiona il QR code</div><p class="text">Chiedi all\'host di mostrare il QR code dal suo schermo.</p></main>';
}else{
  me = loadMe();
  if(me && me.pid){
    // la stanza esiste ancora e ci conosce?
    post('/api/join', {room, pid:me.pid, name:me.name}).then(r => { me.pid = r.pid; me.name = r.name; saveMe(); connect(); }).catch(() => { localStorage.removeItem(MEKEY); me = null; showJoin(); });
  }else showJoin();
}
</script>
</body>
</html>
